.hero{position:absolute;inset:0;z-index:10;pointer-events:none;text-align:center}.hero h1{position:absolute;top:35.9%;left:50%;transform:translateX(-50%);width:min(901px,calc(100vw - 48px));margin:0;font-size:clamp(62px,6.8vw,100px);font-weight:500;line-height:.8;letter-spacing:-.04em;white-space:nowrap;text-shadow:0 3px 22px rgba(0,0,0,.22);transition:opacity 900ms var(--ease),filter 900ms var(--ease),transform 900ms var(--ease)}.hero h1 span{display:inline-block;transition:opacity 900ms var(--ease),filter 900ms var(--ease),transform 900ms var(--ease)}.title-hidden h1{opacity:0;filter:blur(12px);transform:translateX(-50%) translateY(-10px)}.title-hidden h1 span{opacity:0;filter:blur(12px);transform:translateY(-10px)}.title-hidden h1 span:nth-child(2){transition-delay:90ms}.title-hidden h1 span:nth-child(3){transition-delay:180ms}
.hero p{position:absolute;top:calc(46.78% + 94px);left:50%;transform:translateX(-50%);width:min(734px,calc(100vw - 48px));margin:0;font-size:clamp(14px,1.25vw,18px);font-weight:400;line-height:1.2;letter-spacing:-.04em;text-shadow:0 3px 18px rgba(0,0,0,.25)}
.header{position:absolute;z-index:30;top:0;left:0;width:100%;display:grid;grid-template-columns:auto 1fr auto;align-items:start;padding:calc(58px + env(safe-area-inset-top)) 40px 40px;text-shadow:0 2px 16px rgba(0,0,0,.22)}.logo{height:24px;display:block}.logo svg{display:block;width:75px;height:32px;overflow:visible}.meta{margin-left:clamp(48px,5vw,70px);display:flex;align-items:center;gap:clamp(28px,3vw,44px);font-size:18px;line-height:1.2;letter-spacing:-.04em}.try{width:152px;height:38px;border:1px solid rgba(255,255,255,.75);border-radius:999px;background:transparent;color:#fff;font:inherit;font-size:18px;cursor:pointer;transition:background 300ms var(--ease),color 300ms var(--ease),border-color 300ms var(--ease)}.try:hover,.try:focus-visible{background:#fff;color:#0b1a26;border-color:#fff}
.controller{position:absolute;z-index:20;top:46.78%;left:50%;transform:translateX(-50%);width:min(880px,calc(100vw - 48px));height:72px;--cap-left:-5px;--cap-width:calc(20% + 5px);--glass-x:50%;--glass-y:50%}.track{position:absolute;top:4px;left:0;width:100%;height:64px;border-radius:999px;background:rgb(24 55 82 / .31);border:1px solid rgb(255 255 255 / .2);-webkit-backdrop-filter:blur(9px) saturate(126%) contrast(108%) brightness(103%);backdrop-filter:blur(9px) saturate(126%) contrast(108%) brightness(103%);box-shadow:0 14px 38px rgb(4 24 43 / .16),0 2px 7px rgb(4 24 43 / .1),inset 1px 1px 0 rgb(255 255 255 / .48),inset -1px -1px 0 rgb(21 49 73 / .14),inset 0 0 0 .5px rgb(255 255 255 / .16);transition:left 980ms var(--slow),width 980ms var(--slow),opacity 400ms linear 650ms}.track:before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(circle at var(--glass-x) var(--glass-y),rgb(255 255 255 / .22),transparent 34%),linear-gradient(120deg,rgb(255 255 255 / .08),transparent 35%,transparent 68%,rgb(255 255 255 / .04))}.capsule{position:absolute;z-index:2;top:-1px;left:var(--cap-left);width:var(--cap-width);height:72px;border-radius:999px;background:rgb(246 251 255 / .24);border:1px solid rgb(255 255 255 / .28);-webkit-backdrop-filter:blur(13px) saturate(128%) contrast(107%) brightness(105%);backdrop-filter:blur(13px) saturate(128%) contrast(107%) brightness(105%);box-shadow:0 11px 28px rgb(4 24 43 / .17),0 2px 6px rgb(4 24 43 / .1),inset 1px 1px 0 rgb(255 255 255 / .62),inset -1px -1px 0 rgb(20 49 73 / .18),inset 0 0 12px rgb(255 255 255 / .055);transition:left 980ms var(--slow),width 980ms var(--slow),background 980ms var(--slow),opacity 400ms linear}.capsule:before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(circle at var(--glass-x) var(--glass-y),rgb(255 255 255 / .24),transparent 34%),linear-gradient(120deg,rgb(255 255 255 / .08),transparent 35%,transparent 68%,rgb(255 255 255 / .04))}.capsule:after,.track:after{content:"";position:absolute;inset:-1px;border-radius:inherit;pointer-events:none;padding:1px;background:conic-gradient(from 180deg,rgb(255 255 255 / .42),transparent 28%,transparent 65%,rgb(255 255 255 / .2));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.3}.track:after{opacity:.27}.cells{position:absolute;inset:0;z-index:3;display:grid;grid-template-columns:repeat(5,1fr)}.cell{height:100%;display:flex;align-items:center;justify-content:center;padding:0 14px;font:400 23px/1.2 Manrope,system-ui,sans-serif;letter-spacing:-.04em;white-space:nowrap;color:#fff;border:0;background:transparent;border-radius:999px;cursor:pointer;transition:opacity 420ms var(--ease),filter 420ms var(--ease),transform 420ms var(--ease)}.cell:first-child{cursor:default}.cell:hover:not(:disabled),.cell:focus-visible{transform:scale(1.02)}.controller.hovering .cell:first-child{opacity:.5}.collapsed .track{left:calc(50% - 96px);width:192px;opacity:0}.collapsed{--cap-left:calc(50% - 100px);--cap-width:200px}.collapsed .cell{opacity:0;filter:blur(10px);transform:scale(.94);pointer-events:none}.collapsed .cell.chosen{opacity:1;filter:none;transform:none;pointer-events:none}.selected .track{left:calc(50% - 96px);width:192px;opacity:0}.selected .capsule{left:calc(50% - 100px);width:200px;background:rgb(246 251 255 / .18)}.reset-label{display:none;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}.selected .chosen-label{display:none}.selected .reset-label{display:inline}
.live{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.error{position:absolute;z-index:40;left:50%;bottom:32px;transform:translateX(-50%);display:none;padding:10px 14px;border-radius:999px;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);font-size:13px;gap:10px;align-items:center}.error.show{display:flex}.error button{border:0;background:#fff;color:#000;border-radius:999px;padding:7px 12px;cursor:pointer}
@media(max-width:900px){.header{padding-left:24px;padding-right:24px}.meta{font-size:14px;gap:22px;margin-left:34px}.try{width:116px;height:36px;font-size:14px}.cell{font-size:clamp(17px,2.5vw,24px)}}
@media(max-width:700px){.header{padding:28px 18px 24px}.logo{height:21px}.logo svg{width:62px;height:27px}.meta{font-size:12px;gap:14px;margin-left:18px}.meta .smart{display:none}.try{width:92px;height:34px;font-size:13px}.hero h1{top:34%;width:calc(100vw - 40px);font-size:clamp(48px,14vw,64px);line-height:.88;white-space:normal}.hero p{top:77%;width:calc(100vw - 44px);font-size:14px}.controller{top:53%;width:calc(100vw - 40px);height:156px}.track{top:0;height:156px;border-radius:28px}.cells{grid-template-columns:repeat(2,1fr);grid-template-rows:48px 54px 54px}.cell:first-child{grid-column:1/3}.cell{font-size:17px;padding:0 8px}.cell:nth-child(3),.cell:nth-child(5){border-left:1px solid rgb(255 255 255 / .12)}.controller:not(.collapsed):not(.selected) .capsule{opacity:0;pointer-events:none}.collapsed .track,.selected .track{left:0;width:100%;opacity:0}.collapsed .capsule,.selected .capsule{left:50%;top:4dvh;transform:translate(-50%,-50%);width:196px;height:64px}.collapsed .cell.chosen,.selected .cell.chosen{display:flex}.selected .capsule{opacity:1}.selected .track{opacity:0}.selected .cell.chosen{display:flex}.selected .cell:not(.chosen){display:none}.error{bottom:14px}}
@media(max-width:700px) and (max-height:700px){.controller{top:50%}.hero p{top:calc(50% + 168px);width:calc(100vw - 32px);font-size:13px}}
@media(max-width:700px) and (max-height:520px) and (orientation:landscape){.hero h1{top:12%;font-size:clamp(28px,7vh,44px)}.controller{top:46%;height:118px}.track{height:118px;border-radius:24px}.cells{grid-template-rows:36px 41px 41px}.cell{font-size:15px}.hero p{top:auto;bottom:6px;font-size:12px;width:calc(100vw - 32px)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition-duration:1ms!important;animation-duration:1ms!important;animation-delay:0ms!important;scroll-behavior:auto!important}.track,.capsule{backdrop-filter:none;-webkit-backdrop-filter:none}.hero h1,.hero h1 span{filter:none!important}}
</style>

<body>

<section class="hero" aria-label="LTX introduction">
<h1 id="title"><span>The</span> <span>world</span> <span>model</span></h1>
<p>LTX builds open world models that give you full control, from production-grade video to systems that understand and operate in the physical world.</p>

<div class="controller" id="controller" role="group" aria-label="Choose state">
<div class="track"></div><div class="capsule"></div>
<div class="cells">
<div class="cell" aria-hidden="true">Select state →</div>
<button class="cell" data-key="scene" type="button" disabled>Scene</button>
<button class="cell" data-key="light" type="button" disabled>Lighting</button>
<button class="cell" data-key="clothing" type="button" disabled>Clothing</button>

</div>

</div>
<script>
(function(){
"use strict";
var base="clothing",state="base",busy=false,token=0,active=null,hiddenAt=0;
var stage=document.getElementById("stage"),controller=document.getElementById("controller"),title=document.getElementById("title"),live=document.getElementById("live"),err=document.getElementById("error"),retry=document.getElementById("retry");
var videos={},buttons={},pairs={scene:["scene","scene-reverse"],light:["light","light-reverse"],clothing:["clothing","clothing-reverse"],colorway:["colorway","colorway-reverse"]};
var els=document.querySelectorAll("video"),bs=document.querySelectorAll(".cell[data-key]");
for(var i=0;i<els.length;i++){videos[els[i].getAttribute("data-key")]=els[i];els[i].pause();els[i].currentTime=0}
for(i=0;i<bs.length;i++){buttons[bs[i].getAttribute("data-key")]=bs[i]}
function announce(s){live.textContent=s}
function pauseAll(){for(var k in videos){if(videos[k])videos[k].pause()}}
function show(v){for(var k in videos)videos[k].classList.remove("visible");v.classList.add("visible")}
function hideError(){err.classList.remove("show")}
function fail(msg,key){
busy=false;controller.classList.remove("collapsed");controller.classList.remove("selected");hideError();err.classList.add("show");document.getElementById("errorText").textContent=msg;announce(msg);if(key&&buttons[key])buttons[key].disabled=false
}
function readyPair(key){
var p=pairs[key];return videos[p[0]].readyState>=2&&videos[p[1]].readyState>=2
}
function setReady(key){if(readyPair(key)){buttons[key].disabled=false}}
for(i=0;i<bs.length;i++){(function(b){b.addEventListener("click",function(){if(b.disabled||busy||state!=="base")return;forward(b.getAttribute("data-key"))});b.addEventListener("pointerenter",function(){if(!busy&&!controller.classList.contains("selected")){controller.classList.add("hovering");var idx=b.getAttribute("data-key");setCapsule(idx)}});b.addEventListener("pointerleave",function(){if(!controller.classList.contains("selected")){controller.classList.remove("hovering");setCapsule("base")}})})(bs[i])}
function setCapsule(key){
var left={base:"-5px",scene:"20%",light:"40%",clothing:"60%",colorway:"80%"}[key];
var width={base:"calc(20% + 5px)",scene:"20%",light:"20%",clothing:"20%",colorway:"calc(20% + 5px)"}[key];
controller.style.setProperty("--cap-left",left);controller.style.setProperty("--cap-width",width)
}
function hold(v,ratio){var d=v.duration||2.08;var t=Math.max(.001,d-(ratio||.06));try{v.currentTime=t}catch(e){}}
function playTransition(key,reverse,myToken,done){
var name=reverse?key+"-reverse":key,v=videos[name],start=Date.now(),fired=false,raf=0,timer=0;
if(!v||myToken!==token){return}
function cleanup(){v.removeEventListener("loadeddata",onData);v.removeEventListener("playing",onPlaying);v.removeEventListener("canplay",onData);if(v.requestVideoFrameCallback&&v.cancelVideoFrameCallback&&raf)try{v.cancelVideoFrameCallback(raf)}catch(e){}if(timer)clearTimeout(timer)}
function success(){if(fired||myToken!==token)return;fired=true;cleanup();pauseAll();hold(v,reverse&&key==="scene"?.18:.06);show(v);done(v)}
function frame(mediaTime){if(myToken!==token)return;if(v.readyState>=2&&mediaTime<=.5)success();else raf=v.requestVideoFrameCallback(frame)}
function onData(){if(!v.requestVideoFrameCallback)fallback()}
function onPlaying(){if(!v.requestVideoFrameCallback)fallback()}
function fallback(){if(fired||myToken!==token)return;if(v.readyState>=2)requestAnimationFrame(function(){requestAnimationFrame(function(){success()})})}
function fail(){if(fired||myToken!==token)return;cleanup();failMsg()}
function failMsg(){if(reverse){state="selected";controller.classList.add("selected");fail("Reset transition failed.",key)}else{fail("Transition failed — the previous frame is preserved.",key)}}
v.pause();try{v.currentTime=0}catch(e){}
v.addEventListener("loadeddata",onData);v.addEventListener("canplay",onData);v.addEventListener("playing",onPlaying);
timer=setTimeout(function(){if(document.hidden){timer=setTimeout(arguments.callee,250);return}fail()},12000);
try{
var p=v.play();
if(v.requestVideoFrameCallback)raf=v.requestVideoFrameCallback(frame);
if(p&&p.catch)p.catch(function(){failMsg()});
}catch(e){failMsg()}
}
function forward(key){
busy=true;token++;var my=token,b=buttons[key],v=videos[key];active=v;
controller.classList.add("collapsed");setCapsule(key);b.classList.add("chosen");title.classList.add("title-hidden");announce("Loading "+key);
setTimeout(function(){if(my!==token)return;playTransition(key,false,my,function(){state="selected";busy=false;controller.classList.remove("collapsed");controller.classList.add("selected");for(var k in buttons){buttons[k].disabled=true}buttons[key].disabled=false;announce("Selected "+key+". Reset is available.")})},120)
}
function reset(){
if(busy||state!=="selected")return;busy=true;token++;var my=token,key=Object.keys(buttons).filter(function(k){return !buttons[k].disabled})[0]||"colorway";controller.classList.remove("selected");controller.classList.add("collapsed");announce("Returning to base");
playTransition(key,true,my,function(){
if(my!==token)return;state="base";busy=false;controller.classList.remove("collapsed");title.classList.remove("title-hidden");for(var k in buttons){buttons[k].disabled=true;buttons[k].classList.remove("chosen")}setCapsule("base");for(var q in pairs)setReady(q);announce("Base state restored.")
})
}
for(i=0;i<bs.length;i++){(function(b){b.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();b.click()}})})(bs[i])}
buttons.colorway.addEventListener("click",function(){if(state==="selected"&&!busy)reset()});
document.addEventListener("pointermove",function(e){var r=controller.getBoundingClientRect();controller.style.setProperty("--glass-x",((e.clientX-r.left)/r.width*100)+"%");controller.style.setProperty("--glass-y",((e.clientY-r.top)/r.height*100)+"%")});
document.addEventListener("visibilitychange",function(){if(document.hidden){hiddenAt=Date.now();if(active)active.pause()}else if(active&&busy){try{active.play()}catch(e){}}});
retry.addEventListener("click",function(){hideError();if(state==="base"){for(var k in pairs)setReady(k)}else reset()});
for(i=0;i<els.length;i++){(function(v){v.addEventListener("loadeddata",function(){var k=v.getAttribute("data-key");for(var p in pairs)if(pairs[p].indexOf(k)>=0)setReady(p)});v.addEventListener("error",function(){var k=v.getAttribute("data-key");if(buttons[k])buttons[k].disabled=true})})(els[i])}
window.addEventListener("load",function(){var v=videos.base;v.pause();try{v.currentTime=0}catch(e){}for(var k in pairs)setReady(k)});
setCapsule("base");
})();
</script>
