name: Refresh market prices

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches:
      - '**'
    paths:
      - 'scripts/update_market_prices.py'
      - 'data/market-prices.json'
      - 'prices/**/*.html'
      - 'index.html'
      - '.github/workflows/refresh-market-prices.yml'
  schedule:
    - cron: "*/30 4-16 * * 6,0,1,2,3"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check pandas lxml requests
      - name: Dry-run price rendering
        run: python scripts/update_market_prices.py --dry-run
      - name: Render family base prices
        run: python scripts/update_market_prices.py
      - name: Commit rendered prices on the current branch
        run: |
          if git diff --quiet -- index.html 'prices/**/*.html'; then
            echo "No rendered price changes"
            exit 0
          fi
          git config user.name "Ahaneiffel Price Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html prices/
          git commit -m "chore: render family base prices"
          git pull --rebase origin "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          git push
