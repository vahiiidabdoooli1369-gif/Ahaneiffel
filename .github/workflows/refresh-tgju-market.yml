name: Refresh TGJU market board
on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser
        run: python -m pip install --disable-pip-version-check pandas lxml requests beautifulsoup4
      - name: Read public TGJU quotes
        run: python scripts/fetch_tgju_market.py
      - name: Commit changed market feed
        run: |
          if git diff --quiet -- data/tgju-market.json; then
            echo "No TGJU quote changes"
            exit 0
          fi
          git config user.name "Ahaneiffel Market Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/tgju-market.json
          git commit -m "chore: refresh TGJU market board"
          git push
