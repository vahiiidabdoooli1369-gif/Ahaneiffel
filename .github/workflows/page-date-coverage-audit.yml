name: Page date coverage audit
on:
  pull_request:
    paths:
      - '**/*.html'
      - 'scripts/audit_page_dates.py'
      - 'scripts/test_audit_page_dates.py'
      - 'scripts/build_page_date_review_queue.py'
      - 'scripts/test_page_date_review_queue.py'
      - '.github/workflows/page-date-coverage-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: page-date-coverage-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test SEO metadata audit logic
        run: python3 scripts/audit_seo_metadata.py --self-test
      - name: Run SEO metadata regression tests
        run: python3 -m unittest scripts/test_audit_seo_metadata.py -v
      - name: Generate SEO metadata audit report
        run: python3 scripts/audit_seo_metadata.py --output artifacts/seo-metadata-audit.json
      - name: Test audit logic
        run: python3 scripts/audit_page_dates.py --self-test
      - name: Run regression tests
        run: python3 -m unittest scripts/test_audit_page_dates.py scripts/test_page_date_review_queue.py -v
      - name: Compile audit scripts
        run: python3 -m py_compile scripts/audit_page_dates.py scripts/build_page_date_review_queue.py
      - name: Generate page date coverage report
        run: python3 scripts/audit_page_dates.py --output artifacts/page-date-audit.json
      - name: Build prioritized human-review queue
        run: python3 scripts/build_page_date_review_queue.py --input artifacts/page-date-audit.json --output artifacts/page-date-review-queue.json
      - name: Upload report and review queue
        uses: actions/upload-artifact@v4
        with:
          name: page-date-coverage-report
          path: |
            artifacts/page-date-audit.json
            artifacts/page-date-review-queue.json
            artifacts/seo-metadata-audit.json
