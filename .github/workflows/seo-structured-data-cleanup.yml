name: SEO Structured Data Cleanup

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[seo-cleanup]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Remove obsolete FAQPage structured data
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          changed = []
          for p in Path('.').rglob('*.html'):
              if any(part in {'.git', 'node_modules'} for part in p.parts):
                  continue
              s = p.read_text(encoding='utf-8')
              pattern = r'<script\s+type=["\']application/ld\+json["\']>\s*\{[^<]*?["\']@type["\']\s*:\s*["\']FAQPage["\'][\s\S]*?</script>'
              s2 = re.sub(pattern, '', s, flags=re.IGNORECASE)
              if s2 != s:
                  p.write_text(s2, encoding='utf-8')
                  changed.append(str(p))

          print(f'Removed obsolete FAQPage JSON-LD from {len(changed)} HTML files')
          for p in changed:
              print(p)
          PY

      - name: Commit cleanup
        run: |
          if git diff --quiet -- '*.html'; then
            echo "No FAQPage cleanup needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          git commit -m "SEO: remove obsolete FAQPage structured data [seo-cleanup]"
          git push origin main
