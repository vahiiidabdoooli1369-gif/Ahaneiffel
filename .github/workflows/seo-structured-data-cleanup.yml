name: SEO Structured Data Audit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[seo-cleanup]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Audit FAQPage structured data
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          found = []
          for p in Path('.').rglob('*.html'):
              if any(part in {'.git', 'node_modules'} for part in p.parts):
                  continue
              s = p.read_text(encoding='utf-8')
              if re.search(r'"@type"\s*:\s*"FAQPage"', s, flags=re.IGNORECASE):
                  found.append(str(p))

          print(f'FAQPage JSON-LD found in {len(found)} HTML files')
          for p in found:
              print(p)
          PY

      - name: Validate structured data files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          errors = []
          for p in Path('.').rglob('*.html'):
              if any(part in {'.git', 'node_modules'} for part in p.parts):
                  continue
              s = p.read_text(encoding='utf-8')
              for m in re.finditer(r'<script\s+type=["\']application/ld\+json["\']>([\s\S]*?)</script>', s, flags=re.IGNORECASE):
                  block = m.group(1).strip()
                  if not block:
                      errors.append(f'{p}: empty JSON-LD block')
          if errors:
              print("\n".join(errors))
              raise SystemExit(1)
          print("Structured data blocks passed the basic non-empty audit.")
          PY
