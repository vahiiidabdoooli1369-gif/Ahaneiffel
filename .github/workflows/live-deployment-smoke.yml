name: Live Site Deployment Smoke Check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ahaneiffel-live-smoke
  cancel-in-progress: true

jobs:
  live-site:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for static-site publication
        run: sleep 60

      - name: Verify live homepage, price center, and price feed
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html
          import json
          import re
          import time
          from urllib.request import Request, urlopen

          BASE = "https://ahaneiffel.top"
          DIGITS = str.maketrans("۰۱۲۳۴۵۶۷۸۹٠١٢٣٤٥٦٧٨٩", "01234567890123456789")

          def fetch(path):
              url = f"{BASE}{path}?smoke={int(time.time())}"
              req = Request(url, headers={
                  "User-Agent": "Ahaneiffel-Live-Smoke/1.0",
                  "Cache-Control": "no-cache, no-store, max-age=0",
                  "Pragma": "no-cache",
              })
              with urlopen(req, timeout=25) as response:
                  if response.status != 200:
                      raise RuntimeError(f"{path}: HTTP {response.status}")
                  return response.read().decode("utf-8", "replace")

          def digits_only(value):
              return re.sub(r"\D", "", str(value).translate(DIGITS))

          errors = []
          for attempt in range(1, 6):
              errors.clear()
              try:
                  feed = json.loads(fetch("/data/market-prices.json"))
                  home = fetch("/")
                  prices = fetch("/prices/")
                  llms = fetch("/llms.txt")

                  # Check representative buying guides after publication, not only in the repository.
                  guide_paths = [
                      "/guides/angle-size-selection/",
                      "/guides/channel-light-vs-heavy/",
                      "/guides/rebar-12-vs-14/",
                      "/guides/sheet-3mm-vs-4mm/",
                      "/guides/iron-order-check/",
                      "/guides/iron-price-calculation/",
                      "/guides/iron-shipping-cost/",
                  ]
                  for guide_path in guide_paths:
                      guide = fetch(guide_path)
                      title_match = re.search(r"<title[^>]*>([\s\S]*?)</title>", guide, re.I)
                      canonical_match = re.search(
                          r"""<link\s+rel=["']canonical["']\s+href=["']([^"']+)["']""",
                          guide,
                          re.I,
                      )
                      h1_count = len(re.findall(r"<h1\b", guide, re.I))
                      visible_text = re.sub(r"<[^>]+>", " ", html.unescape(guide))
                      visible_text = re.sub(r"\s+", " ", visible_text).strip()
                      if not title_match or not title_match.group(1).strip():
                          errors.append(f"{guide_path} is missing a title")
                      expected_canonical = BASE + guide_path
                      if not canonical_match or canonical_match.group(1).rstrip("/") != expected_canonical.rstrip("/"):
                          errors.append(f"{guide_path} has a missing or incorrect canonical")
                      if h1_count != 1:
                          errors.append(f"{guide_path} must contain exactly one H1; found {h1_count}")
                      if len(visible_text) < 1200:
                          errors.append(f"{guide_path} appears incomplete on the live site ({len(visible_text)} visible characters)")

                  # Detect stale public business-hours text even after the source is fixed.
                  def has_verified_hours(value):
                      value = html.unescape(value).translate(DIGITS)
                      value = re.sub(r"\s+", " ", value)
                      return bool(re.search(
                          r"ساعت\s*کاری.{0,80}08:30\s*(?:الی|تا|[-–])\s*18:30",
                          value,
                          re.I | re.S,
                      ))

                  if not has_verified_hours(prices):
                      errors.append("/prices/ business hours are missing or differ from 08:30–18:30")
                  if not has_verified_hours(llms):
                      errors.append("/llms.txt business hours are missing or differ from 08:30–18:30")

                  if not feed.get("published_date"):
                      errors.append("price feed has no published_date")
                  if 'data-price-family="میلگرد"' not in home:
                      errors.append("live homepage is missing the crawlable price table marker")
                  if "در حال دریافت" in home:
                      errors.append("live homepage still contains the old 'در حال دریافت' placeholder")
                  if "5840794_1788807556_47050c2b07bd3293" not in home:
                      errors.append("live homepage does not contain the current social-preview image metadata")
                  if feed.get("published_date") and feed["published_date"] not in prices:
                      errors.append("live /prices/ date does not match the price feed date")

                  def text_only(value):
                      return re.sub(r"<[^>]+>", " ", html.unescape(value)).strip()

                  daily = re.search(r'<section class="price-section" id="daily-prices">([\s\S]*?)</section>', prices, re.I)
                  price_rows = []
                  if not daily:
                      errors.append("live /prices/ is missing the daily price summary section")
                  else:
                      for row_html in re.findall(r"<tr\b[^>]*>([\s\S]*?)</tr>", daily.group(1), re.I):
                          cells = [text_only(cell) for cell in re.findall(r"<td\b[^>]*>([\s\S]*?)</td>", row_html, re.I)]
                          if len(cells) >= 3:
                              price_rows.append(cells)

                  home_rows = {}
                  for family, row_html in re.findall(r'<tr\b[^>]*data-price-family="([^"]+)"[^>]*>([\s\S]*?)</tr>', home, re.I):
                      quote = re.search(r'<td\b[^>]*class="quote"[^>]*>([\s\S]*?)</td>', row_html, re.I)
                      if quote:
                          home_rows[family] = digits_only(text_only(quote.group(1)))

                  for item in feed.get("rows", []):
                      aliases = item.get("raw") or [""]
                      family = aliases[0]
                      price = digits_only(item.get("price", ""))
                      if not family or not price:
                          errors.append("price feed contains an incomplete row")
                          continue

                      page_row = next((row for row in price_rows if any(alias and alias in row[0] for alias in aliases)), None)
                      if page_row is None:
                          errors.append(f"/prices/ is missing price family: {family}")
                      elif digits_only(page_row[2]) != price:
                          errors.append(f"/prices/ price mismatch for {family}: feed={item.get('price')}, page={page_row[2]}")

                      home_family = next((name for name in home_rows if name in aliases), None)
                      if home_family is not None and home_rows[home_family] != price:
                          errors.append(f"homepage price mismatch for {family}: feed={item.get('price')}, homepage={home_rows[home_family]}")

                  if not errors:
                      print(f"PASS: live homepage, price center, and feed agree for {len(feed.get('rows', []))} price families; date={feed['published_date']}.")
                      raise SystemExit(0)
              except SystemExit:
                  raise
              except Exception as exc:
                  errors.append(str(exc))

              print(f"Attempt {attempt}/5: " + "; ".join(errors))
              if attempt < 5:
                  time.sleep(60)

          raise SystemExit("Live deployment is not synchronized with repository content: " + "; ".join(errors))
          PY
