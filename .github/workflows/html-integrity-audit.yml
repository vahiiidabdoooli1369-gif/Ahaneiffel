name: HTML Integrity Audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test sitemap index crawler
        run: python3 scripts/test_sitemap_crawl.py
      - name: Run HTML integrity audit
        run: python3 scripts/static_html_integrity_audit.py
