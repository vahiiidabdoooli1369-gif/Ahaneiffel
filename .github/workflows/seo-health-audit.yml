name: SEO Health Audit
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run SEO health audit
        continue-on-error: true
        run: python3 scripts/seo_health_audit.py
