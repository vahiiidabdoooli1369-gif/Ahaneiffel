name: SEO Architecture Guard
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'scripts/seo_architecture_guard.py'
      - 'llms.txt'
      - '.github/workflows/seo-architecture-guard.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate site architecture
        run: python3 scripts/seo_architecture_guard.py
