name: Normalize Homepage Canonical Host

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    if: ${{ !contains(github.event.head_commit.message, '[homepage-host-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Normalize homepage host
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s2 = s.replace('https://www.ahaneiffel.top', 'https://ahaneiffel.top')
          if s2 != s:
              p.write_text(s2, encoding='utf-8')
          PY
      - name: Commit host normalization
        run: |
          if git diff --quiet -- index.html; then
            echo "Homepage host already normalized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "normalize homepage canonical host [homepage-host-fix]"
          git push origin main
