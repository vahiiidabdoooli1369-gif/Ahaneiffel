name: AI GEO Integrity
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-ai-geo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate AI retrieval map
        shell: bash
        run: |
          set -euo pipefail
          test -s llms.txt
          test -s reference/ai-retrieval-map/index.html
          grep -Fq 'rel="canonical"' reference/ai-retrieval-map/index.html
          grep -Fq 'dateModified' reference/ai-retrieval-map/index.html
          grep -Fq 'https://ahaneiffel.top/reference/ai-retrieval-map/' reference/ai-retrieval-map/index.html
          grep -Fq 'prices/' llms.txt
          grep -Fq 'products/' llms.txt
          grep -Fq 'buy-iron/' llms.txt
          grep -Fq '<loc>https://ahaneiffel.top/reference/ai-retrieval-map/</loc>' sitemap-reference.xml

      - name: Validate sitemap XML
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import xml.etree.ElementTree as ET
          for name in ("sitemap.xml", "sitemap-reference.xml"):
              ET.parse(name)
              print(name, "OK")
          PY

      - name: Validate every sitemap and detect duplicate URLs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from datetime import date, datetime
          from pathlib import Path
          from urllib.parse import urlparse

          NS = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          files = sorted(Path(".").glob("sitemap*.xml"))
          if not files:
              raise SystemExit("No sitemap XML files found")

          all_urls = {}
          sitemap_indexes = 0
          urlsets = 0
          missing_lastmod = 0

          for path in files:
              root = ET.parse(path).getroot()
              if root.tag.endswith("sitemapindex"):
                  sitemap_indexes += 1
                  for node in root.findall("sm:sitemap", NS):
                      loc = (node.findtext("sm:loc", default="", namespaces=NS) or "").strip()
                      if not loc.startswith("https://ahaneiffel.top/"):
                          raise SystemExit(f"{path}: invalid sitemap location: {loc}")
                      child_path = Path(urlparse(loc).path.lstrip("/"))
                      if not child_path.is_file():
                          raise SystemExit(f"{path}: referenced sitemap file missing: {child_path}")
                  continue

              if not root.tag.endswith("urlset"):
                  raise SystemExit(f"{path}: unexpected XML root: {root.tag}")
              urlsets += 1
              for node in root.findall("sm:url", NS):
                  loc = (node.findtext("sm:loc", default="", namespaces=NS) or "").strip()
                  if not loc.startswith("https://ahaneiffel.top/"):
                      raise SystemExit(f"{path}: invalid page URL: {loc}")
                  if loc in all_urls:
                      raise SystemExit(f"Duplicate sitemap URL: {loc} in {all_urls[loc]} and {path}")
                  all_urls[loc] = path
                  lastmod = (node.findtext("sm:lastmod", default="", namespaces=NS) or "").strip()
                  if not lastmod:
                      missing_lastmod += 1
                      continue
                  try:
                      date.fromisoformat(lastmod[:10])
                  except ValueError:
                      try:
                          datetime.fromisoformat(lastmod.replace("Z", "+00:00"))
                      except ValueError:
                          raise SystemExit(f"{path}: invalid lastmod for {loc}: {lastmod}")

          print(f"Validated {sitemap_indexes} sitemap index file(s), {urlsets} URL set(s), {len(all_urls)} unique page URL(s).")
          print(f"Optional lastmod missing on {missing_lastmod} page URL(s); this is a warning, not a failure.")
          PY
      - name: Check price feed matches visible price tables
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html
          import json
          import re
          from pathlib import Path

          def text_only(value):
              return re.sub(r"<[^>]+>", " ", html.unescape(value)).strip()

          feed = json.loads(Path("data/market-prices.json").read_text(encoding="utf-8"))
          price_html = Path("prices/index.html").read_text(encoding="utf-8")
          daily = re.search(r'<section class="price-section" id="daily-prices">([\s\S]*?)</section>', price_html)
          if not daily:
              raise SystemExit("Could not find the daily price summary table")
          summary_rows = []
          for row in re.findall(r"<tr\b[^>]*>([\s\S]*?)</tr>", daily.group(1), re.I):
              cells = [text_only(cell) for cell in re.findall(r"<td\b[^>]*>([\s\S]*?)</td>", row, re.I)]
              if len(cells) >= 3:
                  summary_rows.append(cells)
          if not summary_rows:
              raise SystemExit("Daily price summary table contains no data rows")

          homepage = Path("index.html").read_text(encoding="utf-8")
          home_rows = re.findall(r'<tr\b[^>]*data-price-family="([^"]+)"[^>]*>([\s\S]*?)</tr>', homepage, re.I)

          if feed.get("verified_today") is not True:
              for item in feed.get("rows", []):
                  aliases = item.get("raw", [])
                  family = aliases[0] if aliases else ""
                  row = next((r for r in summary_rows if any(alias and alias in r[0] for alias in aliases)), None)
                  if row is None or "استعلام" not in row[2]:
                      raise SystemExit(f"Unverified price is not safely suppressed on /prices/: {family}")
              for family, row_html in home_rows:
                  quote = re.search(r'<td\b[^>]*class="quote"[^>]*>([\s\S]*?)</td>', row_html, re.I)
                  if not quote or "استعلام" not in text_only(quote.group(1)):
                      raise SystemExit(f"Unverified homepage price is not safely suppressed: {family}")
              print(f"Safe price mode OK: {len(feed.get('rows', []))} unverified price families and {len(home_rows)} homepage rows show inquiry text, not stale numbers.")
          else:
              digits = str.maketrans("۰۱۲۳۴۵۶۷۸۹٠١٢٣٤٥٦٧٨٩", "01234567890123456789")
              def number(value):
                  return re.sub(r"\D", "", str(value).translate(digits))
              for item in feed.get("rows", []):
                  aliases = item.get("raw", [])
                  family = aliases[0] if aliases else ""
                  row = next((r for r in summary_rows if any(alias and alias in r[0] for alias in aliases)), None)
                  if row is None or number(row[2]) != str(item.get("price", "")):
                      raise SystemExit(f"Verified price mismatch for {family}")
                  expected_unit = item.get("unit", feed.get("unit", ""))
                  if expected_unit and expected_unit not in row[1]:
                      raise SystemExit(f"Unit mismatch for {family}: expected {expected_unit}, page={row[1]}")
              for family, row_html in home_rows:
                  item = next((x for x in feed.get("rows", []) if family in x.get("raw", [])), None)
                  quote = re.search(r'<td\b[^>]*class="quote"[^>]*>([\s\S]*?)</td>', row_html, re.I)
                  if item is None or not quote or number(text_only(quote.group(1))) != str(item.get("price", "")):
                      raise SystemExit(f"Verified homepage/feed price mismatch: {family}")
              print(f"Verified price integrity OK: {len(feed.get('rows', []))} feed rows and {len(home_rows)} homepage rows.")
          PY
      - name: Check canonical URL is live in source
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'https://ahaneiffel.top/reference/ai-retrieval-map/' reference/ai-retrieval-map/index.html
