name: Enrich product review content
on:
  push:
    paths:
      - "scripts/enrich-product-reviews.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Enrich all product pages
        run: python scripts/enrich-product-reviews.py
      - name: Commit generated product reviews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products/
          if git diff --cached --quiet; then
            echo "No product pages needed enrichment."
          else
            git commit -m "افزودن نقد و بررسی تخصصی به صفحات محصولات"
            git push
          fi
