name: Update all page and sitemap dates to 1405-08-02
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-page-dates
  cancel-in-progress: false
jobs:
  update-dates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set update dates
        run: python3 scripts/update-page-dates.py
      - name: Commit updated page dates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' '*.xml'
          if git diff --cached --quiet; then
            echo "No page date changes needed."
          else
            git commit -m "Update all page and sitemap dates to 1405/08/02"
            git push
          fi
