name: SEO Sitemap Integrity

on:
  push:
    branches: [main]
    paths:
      - 'sitemap*.xml'
      - '.github/workflows/seo-sitemap-integrity.yml'
  pull_request:
    paths:
      - 'sitemap*.xml'
      - '.github/workflows/seo-sitemap-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate sitemap index, URL sets, hosts, duplicates and local targets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import urlsplit
          import xml.etree.ElementTree as ET

          ROOT = Path('.').resolve()
          NS = {'sm': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
          files = sorted(Path('.').glob('sitemap*.xml'))
          if not files:
              raise SystemExit('No sitemap files found')

          sitemap_files = {p.name for p in files}
          seen = set()
          url_count = 0
          child_count = 0

          def canonical(url):
              return url == 'https://ahaneiffel.top' or url.startswith('https://ahaneiffel.top/')

          def local_target(url):
              parsed = urlsplit(url)
              if parsed.query or parsed.fragment:
                  raise SystemExit(f'Sitemap URL contains query/fragment: {url}')
              path = parsed.path or '/'
              if path == '/':
                  return ROOT / 'index.html'
              return ROOT / path.rstrip('/').lstrip('/') / 'index.html'

          for path in files:
              root = ET.parse(path).getroot()
              if root.tag.endswith('sitemapindex'):
                  for node in root.findall('sm:sitemap/sm:loc', NS):
                      url = (node.text or '').strip()
                      if not canonical(url):
                          raise SystemExit(f'Non-canonical sitemap child URL in {path}: {url}')
                      parsed = urlsplit(url)
                      target = ROOT / parsed.path.lstrip('/')
                      if target.name not in sitemap_files or not target.is_file():
                          raise SystemExit(f'Sitemap index points to missing local sitemap: {url}')
                      child_count += 1
              elif root.tag.endswith('urlset'):
                  for node in root.findall('sm:url/sm:loc', NS):
                      url = (node.text or '').strip()
                      if not canonical(url):
                          raise SystemExit(f'Non-canonical sitemap URL in {path}: {url}')
                      if url in seen:
                          raise SystemExit(f'Duplicate sitemap URL: {url}')
                      seen.add(url)
                      target = local_target(url)
                      if not target.is_file():
                          raise SystemExit(f'Sitemap target missing locally: {url} -> {target.relative_to(ROOT)}')
                      url_count += 1
              else:
                  raise SystemExit(f'Unsupported sitemap XML root in {path}: {root.tag}')

          print(f'Validated {len(files)} sitemap XML files, {child_count} sitemap-index children, and {url_count} unique URL targets.')
          PY
