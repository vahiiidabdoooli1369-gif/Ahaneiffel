name: Install site-wide live price feed

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject live price feed into HTML pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          tag='<script src="/assets/live-price-feed.js" defer></script>'
          changed=[]
          for p in Path('.').rglob('*.html'):
              if '.git' in p.parts:
                  continue
              s=p.read_text(encoding='utf-8')
              if '/assets/live-price-feed.js' in s:
                  continue
              if '.price-table' not in s and '.price-table-card' not in s:
                  continue
              if '</head>' not in s:
                  continue
              p.write_text(s.replace('</head>', tag+'\n</head>', 1), encoding='utf-8')
              changed.append(str(p))
          print(f'Injected live price feed into {len(changed)} HTML pages')
          for p in changed:
              print(p)
          PY
      - name: Commit injected scripts
        run: |
          git config user.name "Ahaneiffel Bot"
          git config user.email "actions@users.noreply.github.com"
          git add '*.html'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add live market price feed to price pages [skip ci]"
          git fetch origin main
          if ! git rebase origin/main; then
            echo "Concurrent change detected; aborting injection without failing the workflow."
            git rebase --abort || true
            exit 0
          fi
          git push
