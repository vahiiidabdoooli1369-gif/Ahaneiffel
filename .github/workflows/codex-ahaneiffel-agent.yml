name: Ahaneiffel Autonomous SEO Agent

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ahaneiffel-autonomous-agent
  cancel-in-progress: false

jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "Ahaneiffel Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create isolated branch
        id: branch
        run: |
          BRANCH="agent/seo-${GITHUB_RUN_ID}"
          git checkout -b "$BRANCH"
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Check AI agent credentials
        id: credentials
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::OPENAI_API_KEY is not configured. The scheduled audit workflow can still run, but autonomous Codex implementation is skipped."
          fi

      - name: Run four-role Codex team
        id: codex
        if: steps.credentials.outputs.configured == 'true'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          allow-bots: true
          permission-profile: ":workspace"
          safety-strategy: "drop-sudo"
          prompt-file: .agent/ahaneiffel-agent-prompt.md
          output-file: .agent/codex-last-run.txt

      - name: Check for changes
        id: changes
        if: steps.credentials.outputs.configured == 'true'
        run: |
          if git status --porcelain --untracked-files=all | grep -v '^?? \.agent/codex-last-run\.txt$' | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit changes
        if: steps.credentials.outputs.configured == 'true' && steps.changes.outputs.changed == 'true'
        run: |
          git add -A ':!.agent/codex-last-run.txt'
          git commit -m "chore(agent): autonomous four-role SEO maintenance"

      - name: Push branch
        if: steps.credentials.outputs.configured == 'true' && steps.changes.outputs.changed == 'true'
        run: git push origin "${{ steps.branch.outputs.name }}"

      - name: Open pull request
        if: steps.credentials.outputs.configured == 'true' && steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base main \
            --head "${{ steps.branch.outputs.name }}" \
            --title "chore(agent): autonomous four-role SEO maintenance" \
            --body-file .agent/codex-last-run.txt

      - name: No-op report
        if: steps.credentials.outputs.configured == 'true' && steps.changes.outputs.changed == 'false'
        run: echo "The agent found no safe change worth committing."

      - name: AI agent unavailable
        if: steps.credentials.outputs.configured == 'false'
        run: echo "Autonomous code changes were skipped because OPENAI_API_KEY is not configured. The separate free audit workflow remains scheduled every six hours."
