name: SEO domain cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace legacy Ahaneiffel domain
        shell: bash
        run: |
          set -e
          files=$(git grep -Il -e 'ahaneiffel.com' -e 'www.ahaneiffel.com' -- ':!*.lock' ':!.git/*' || true)
          if [ -n "$files" ]; then
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              sed -i 's#https\?://www\.ahaneiffel\.com#https://ahaneiffel.top#g; s#https\?://ahaneiffel\.com#https://ahaneiffel.top#g; s#www\.ahaneiffel\.com#ahaneiffel.top#g; s#ahaneiffel\.com#ahaneiffel.top#g' "$file"
            done <<< "$files"
          fi

      - name: Commit cleaned URLs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':!.github/workflows/seo-domain-cleanup.yml'
          if git diff --cached --quiet; then
            echo "No legacy Ahaneiffel domain references found."
            exit 0
          fi
          git commit -m "SEO: replace legacy .com URLs with .top"
          git push
