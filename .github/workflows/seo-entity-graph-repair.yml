name: SEO Entity Graph Repair
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair product entity links
        run: python3 scripts/seo-entity-graph-repair.py
      - name: Commit repairs
        run: |
          git config user.name "ahaneiffel-seo-bot"
          git config user.email "seo-bot@users.noreply.github.com"
          if git diff --quiet; then
            echo "No entity-link repairs needed."
          else
            git add products/
            git commit -m "[seo] repair product entity graph links"
            git push
          fi
