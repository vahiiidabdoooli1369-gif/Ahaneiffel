name: SEO Quality Audit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seo-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate indexable HTML SEO basics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, sys

          files = list(Path('.').rglob('*.html'))
          errors = []
          warnings = []

          for p in files:
              if any(part in {'.git','node_modules'} for part in p.parts):
                  continue
              s = p.read_text(encoding='utf-8', errors='ignore')
              low = s.lower()
              if '<meta name="robots"' not in low and '<meta name="robots"' not in s:
                  warnings.append(f'{p}: missing robots meta')
              if '<link rel="canonical"' not in low:
                  warnings.append(f'{p}: missing canonical')
              titles = re.findall(r'<title[^>]*>(.*?)</title>', s, re.I|re.S)
              if not titles:
                  errors.append(f'{p}: missing title')
              h1 = re.findall(r'<h1\b[^>]*>', s, re.I)
              if len(h1) == 0:
                  warnings.append(f'{p}: missing H1')
              if len(h1) > 1:
                  errors.append(f'{p}: multiple H1 tags ({len(h1)})')
              if 'https://www.ahaneiffel.top' in s:
                  errors.append(f'{p}: legacy www canonical/URL detected')

          print(f'Checked {len(files)} HTML files')
          for w in warnings[:100]: print('WARNING:', w)
          for e in errors[:100]: print('ERROR:', e)
          if errors:
              sys.exit(1)
          PY

      - name: Validate sitemap index
        run: |
          test -f sitemap.xml
          grep -q 'https://ahaneiffel.top/' sitemap.xml
          echo 'Sitemap index present and uses canonical host.'
