name: Persian Typography Audit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ahaneiffel-persian-typography-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typography-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Audit Persian text without rewriting content
        shell: python
        run: |
          from pathlib import Path

          root = Path(".")
          extensions = {
              ".html", ".htm", ".md", ".txt", ".xml", ".json",
              ".css", ".js", ".mjs", ".svg", ".yml", ".yaml",
              ".csv", ".ts", ".tsx", ".jsx"
          }
          files_scanned = 0
          zwnj_files = []
          decode_errors = []

          for path in root.rglob("*"):
              if not path.is_file() or ".git" in path.parts:
                  continue
              if path.suffix.lower() not in extensions:
                  continue
              try:
                  content = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  decode_errors.append(str(path))
                  continue
              except OSError as exc:
                  print(f"WARNING: Could not read {path}: {exc}")
                  continue

              files_scanned += 1
              if "\\u200c" in content:
                  zwnj_files.append(str(path))

          print(f"Scanned {files_scanned} text files.")
          print(f"Files containing Persian half-space (ZWNJ): {len(zwnj_files)}")
          print("Persian half-spaces are preserved; this workflow does not rewrite or commit site content.")
          for path in zwnj_files[:100]:
              print(f"INFO: {path}")

          if decode_errors:
              print(f"WARNING: {len(decode_errors)} files were not valid UTF-8.")
              for path in decode_errors[:50]:
                  print(f"WARNING: {path}")

          print("Persian typography audit completed.")
