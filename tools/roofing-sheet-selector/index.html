<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>انتخاب هوشمند ورق شیروانی | آهن ایفل</title><meta name="description" content="ابزار انتخاب ورق شیروانی بر اساس نوع سقف، فرم پوشش و نیاز پروژه؛ همراه با مسیر مقایسه، محاسبه و استعلام آهن ایفل."><link rel="canonical" href="https://ahaneiffel.top/tools/roofing-sheet-selector/"><meta name="robots" content="index,follow"><style>body{font-family:Arial,sans-serif;max-width:900px;margin:auto;padding:24px;line-height:2;background:#f6f8fb;color:#172033}main{background:#fff;padding:28px;border-radius:18px;box-shadow:0 8px 30px #0001}select,button{padding:13px;margin:7px;border-radius:10px;border:1px solid #ccd4df;font-size:16px}button{background:#124b82;color:#fff;cursor:pointer}.card{padding:18px;margin-top:18px;background:#eef5fb;border-radius:14px}.links a{display:inline-block;margin:6px;padding:8px 12px;background:#fff;border-radius:9px;color:#124b82;text-decoration:none}</style></head><body><main><h1>انتخاب هوشمند ورق شیروانی</h1><p>برای انتخاب اولیه پوشش سقف، نوع پروژه و فرم مناسب را مشخص کنید. نتیجه ابزار یک پیشنهاد اولیه است و جزئیات نهایی باید با ابعاد، شیب سقف، شرایط اجرایی و مشخصات پروژه کنترل شود.</p><label>نوع پروژه</label><select id="use"><option value="building">ساختمان مسکونی</option><option value="industrial">سوله و صنعتی</option><option value="warehouse">انبار</option><option value="farm">کارگاه و فضای کشاورزی</option></select><label>فرم پوشش</label><select id="shape"><option value="trapezoid">ذوزنقه</option><option value="corrugated">کرکره</option><option value="tile">طرح سفال</option></select><button onclick="go()">نمایش پیشنهاد</button><div id="out" class="card">انتخاب‌ها را مشخص کنید.</div><div class="links"><a href="/products/roofing-sheet/">ورق شیروانی</a><a href="/products/sheet/">ورق فولادی</a><a href="/tools/steel-weight-calculator/">محاسبه وزن</a><a href="/tools/steel-comparison/">مقایسه</a><a href="/tools/steel-quote/">استعلام قیمت</a><a href="/tools/project-order/">سفارش پروژه</a></div></main><script>function go(){let u=document.getElementById('use').value,s=document.getElementById('shape').value;let names={trapezoid:'ذوزنقه',corrugated:'کرکره',tile:'طرح سفال'};let use={building:'ساختمان مسکونی',industrial:'سوله و پروژه صنعتی',warehouse:'انبار',farm:'کارگاه یا فضای کشاورزی'};document.getElementById('out').innerHTML='<h2>پیشنهاد اولیه</h2><p>برای <b>'+use[u]+'</b>، بررسی ورق شیروانی <b>'+names[s]+'</b> می‌تواند نقطه شروع مناسبی باشد.</p><p>قبل از سفارش، عرض مفید، ضخامت، طول، پوشش، رنگ، تعداد و شرایط حمل را مشخص کنید.</p><p><a href="/tools/steel-quote/">ارسال مشخصات برای استعلام ←</a></p>'}</script></body></html>
