</head><body><main class="wrap"><section class="box"><h1>محاسبه مقدار و آماده سازی سفارش آهن آلات</h1><p>برای سفارش چندقلمی، مشخصات را ثبت کنید و متن آماده استعلام بسازید. این ابزار قیمت یا وزن مهندسی را حدس نمی زند.</p><div id="rows" aria-label="اقلام سفارش"></div><div id="status" class="status" role="status" aria-live="polite"></div><button type="button" onclick="addRow()">+ افزودن قلم</button><button type="button" class="secondary" onclick="build()">ساخت متن استعلام</button><button type="button" onclick="copyText()">کپی متن</button><div id="out" class="out" tabindex="-1">هنوز سفارشی ثبت نشده است.</div></section><section class="box"><h2>ابزارهای مرتبط</h2><a href="https://ahaneiffel.top/tools/steel-spec-checklist/">چک لیست مشخصات</a><a href="https://ahaneiffel.top/tools/steel-price-request/">استعلام قیمت</a><a href="https://ahaneiffel.top/tools/steel-weight-calculator/">محاسبه وزن</a><a href="https://ahaneiffel.top/tools/project-order/">سفارش پروژه</a></section></main><script>
let n=0;
const rows=document.getElementById('rows'),status=document.getElementById('status'),out=document.getElementById('out');
function announce(message,type=''){status.textContent=message;status.className='status '+type}
function addRow(){
 n++;
 const d=document.createElement('fieldset');
 d.className='row';d.id='r'+n;d.setAttribute('aria-label','قلم سفارش '+n);
 d.innerHTML='<label>محصول<input class="p" placeholder="مثلاً میلگرد" aria-label="نام محصول قلم '+n+'"></label><label>سایز یا مشخصات<input class="s" placeholder="مثلاً 16 آجدار" aria-label="سایز یا مشخصات قلم '+n+'"></label><label>مقدار و واحد<input class="q" placeholder="مثلاً 2 تن" aria-label="مقدار و واحد قلم '+n+'"></label><button type="button" class="remove" aria-label="حذف قلم '+n+'">حذف</button>';
 d.querySelector('.remove').addEventListener('click',()=>{d.remove();announce('قلم سفارش حذف شد.','success')});
 rows.appendChild(d);
 if(n>1)d.querySelector('.p').focus();
}
function clearErrors(){document.querySelectorAll('.field-error').forEach(x=>x.classList.remove('field-error'))}
function build(){
 clearErrors();
 const items=[...document.querySelectorAll('.row')].map((r,i)=>({r,i,p:r.querySelector('.p'),s:r.querySelector('.s'),q:r.querySelector('.q')}));
 const filled=items.filter(x=>x.p.value.trim()||x.s.value.trim()||x.q.value.trim());
 if(!filled.length){const first=items[0]?.p;if(first){first.classList.add('field-error');first.focus()}announce('برای ساخت استعلام، حداقل نام یک محصول و مقدار آن را وارد کنید.','error');return false}
 const incomplete=filled.find(x=>!x.p.value.trim()||!x.q.value.trim());
 if(incomplete){const field=!incomplete.p.value.trim()?incomplete.p:incomplete.q;field.classList.add('field-error');field.focus();announce('برای هر قلم ثبت‌شده، نام محصول و مقدار به همراه واحد لازم است.','error');return false}
 let text='درخواست استعلام آهن آلات\n\n';
 filled.forEach((x,i)=>{text+=(i+1)+') '+x.p.value.trim()+' | '+(x.s.value.trim()||'—')+' | '+x.q.value.trim()+'\n'});
 text+='\nلطفاً قیمت روز، برند/کارخانه موجود، هزینه حمل و زمان تحویل اعلام شود.';
 out.textContent=text;out.focus();announce(filled.length+' قلم آماده استعلام شد.','success');return true;
}
async function copyText(){
 if(out.textContent==='هنوز سفارشی ثبت نشده است.'){announce('ابتدا متن استعلام را بسازید.','error');return}
 try{if(navigator.clipboard)await navigator.clipboard.writeText(out.textContent);else throw new Error('fallback')}catch(e){let x=document.createElement('textarea');x.value=out.textContent;document.body.appendChild(x);x.select();document.execCommand('copy');x.remove()}
 announce('متن استعلام کپی شد.','success');
}
addRow();
</script></body></html>
