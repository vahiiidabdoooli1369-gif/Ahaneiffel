<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سازنده خلاصه سفارش آهن آلات | آماده‌سازی درخواست خرید | آهن ایفل</title><meta name="description" content="ابزار ساخت خلاصه سفارش آهن آلات برای ارسال به فروشنده؛ ثبت محصول، سایز، ضخامت، برند، مقدار، مقصد و زمان تحویل."><meta name="robots" content="index,follow"><link rel="canonical" href="https://ahaneiffel.top/tools/steel-order-summary/"><style>body{font-family:Tahoma,Arial;margin:0;background:#f3f7fa;color:#17202a;line-height:2}main{max-width:900px;margin:auto;padding:22px}.box{background:white;border-radius:16px;padding:22px;margin:16px 0;box-shadow:0 6px 24px #1234 1px}label{display:block;margin:10px 0 4px;font-weight:bold}input,select,textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ccd8e2;border-radius:9px;font:inherit}button,a.btn{display:inline-block;border:0;background:#075ea8;color:#fff;padding:11px 18px;border-radius:9px;margin:8px 4px 0 0;text-decoration:none;cursor:pointer}.out{white-space:pre-wrap;background:#f7fafc;border:1px dashed #9eb1c2;padding:16px;border-radius:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><main><section class="box"><h1>سازنده خلاصه سفارش آهن آلات</h1><p>مشخصات سفارش را وارد کنید تا یک متن مرتب و آماده ارسال ساخته شود.</p><div class="grid"><div><label>محصول</label><select id="product"><option>میلگرد</option><option>تیرآهن</option><option>پروفیل و قوطی</option><option>نبشی</option><option>ناودانی</option><option>ورق سیاه</option><option>ورق شیروانی</option><option>ورق پانچ</option><option>لوله داربستی</option><option>تسمه قالب‌بندی</option><option>بیس پلیت</option></select></div><div><label>سایز / ابعاد</label><input id="size" placeholder="مثلاً ۱۴ یا 40×40"></div><div><label>ضخامت / گرید</label><input id="spec" placeholder="مثلاً 2 میلی‌متر / گرید موردنیاز"></div><div><label>برند / کارخانه</label><input id="brand" placeholder="در صورت نیاز"></div><div><label>مقدار و واحد</label><input id="amount" placeholder="مثلاً 5 تن"></div><div><label>مقصد</label><input id="destination" placeholder="شهر / محل پروژه"></div><div><label>زمان تحویل</label><input id="time" placeholder="مثلاً فردا صبح"></div></div><label>توضیحات</label><textarea id="notes" rows="4" placeholder="شرایط تخلیه، بارگیری، استاندارد یا توضیح تکمیلی"></textarea><button onclick="build()">ساخت خلاصه سفارش</button><button onclick="copyText()">کپی متن</button><a class="btn" href="https://wa.me/989125143831" target="_blank" rel="noopener">واتساپ</a><a class="btn" href="tel:+989125143831">تماس</a></section><section class="box"><h2>متن آماده</h2><div id="out" class="out">هنوز سفارشی ساخته نشده است.</div></section><section class="box"><a href="/tools/project-order/">سفارش چندقلمی پروژه</a> · <a href="/tools/steel-price-request/">استعلام قیمت</a> · <a href="/tools/steel-spec-checklist/">چک‌لیست مشخصات</a> · <a href="/tools/steel-delivery-planner/">برنامه‌ریزی حمل</a></section><script>function v(id){return document.getElementById(id).value.trim()}function build(){let p=v('product'),s=v('size'),sp=v('spec'),b=v('brand'),a=v('amount'),d=v('destination'),t=v('time'),n=v('notes');let x=`سلام، برای خرید ${p} درخواست استعلام دارم.\n\nسایز/ابعاد: ${s||'اعلام نشده'}\nضخامت/گرید: ${sp||'اعلام نشده'}\nبرند/کارخانه: ${b||'آزاد / اعلام نشده'}\nمقدار: ${a||'اعلام نشده'}\nمقصد: ${d||'اعلام نشده'}\nزمان تحویل: ${t||'اعلام نشده'}\nتوضیحات: ${n||'ندارد'}\n\nلطفاً قیمت روز، موجودی، وزن/واحد فروش و هزینه حمل تا مقصد را اعلام کنید.`;document.getElementById('out').textContent=x;return x}async function copyText(){let x=build();try{await navigator.clipboard.writeText(x);alert('متن کپی شد')}catch(e){let a=document.createElement('textarea');a.value=x;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();alert('متن کپی شد')}}</script></main></body></html>
